<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07152f"><title>雷霆神域 | Thunder Realm</title><style>*{box-sizing:border-box}body{margin:0;background:#07152f;color:#f9e4a0;font-family:Georgia,"PingFang SC",serif;overflow:hidden}#app{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#325a9e 0%,#0d2455 50%,#060d20 100%)}#stage{position:relative;width:min(100vw,177.77dvh);aspect-ratio:16/9;overflow:hidden;border:2px solid #b98935;background:linear-gradient(160deg,#173c80aa,#071127d9),radial-gradient(ellipse at center top,#94d3ff,#102e69 65%);box-shadow:inset 0 0 70px #000,0 0 30px #1a76cf}#sky{position:absolute;inset:0;width:100%;height:100%;opacity:.42}h1{position:absolute;top:0;left:0;right:0;text-align:center;margin:.4% 0;font-size:clamp(18px,3.5vw,44px);color:#ffdf83;text-shadow:0 2px #643800,0 0 22px #3eafff;letter-spacing:.18em}.sub{font-size:10px;letter-spacing:.3em;display:block;color:#d1e9ff}.panel{position:absolute;left:21%;top:20%;width:58%;height:59%;padding:1.2%;border:5px ridge #eac36a;border-radius:14px;background:linear-gradient(#08172d,#133e83 45%,#07132d);box-shadow:0 0 20px #00aaff,inset 0 0 20px #1488f3;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:3px}.cell{display:flex;align-items:center;justify-content:center;border:1px solid #c79b43;background:radial-gradient(circle,#2764b0,#0b2353);overflow:hidden}.cell svg{width:80%;height:88%;filter:drop-shadow(0 0 5px #37baff)}.cell.win{background:radial-gradient(circle,#ffc861,#15458b);box-shadow:inset 0 0 18px #fff}.spinning .cell svg{animation:blur .14s linear infinite}@keyframes blur{50%{transform:translateY(20%);opacity:.5}}.side{position:absolute;top:25%;width:18%;height:48%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.left{left:1%}.right{right:1%}.god{width:90%;height:78%}.god path,.god circle{stroke:#f9d88b;stroke-width:2}.side label{font-size:clamp(9px,1.3vw,18px);text-align:center;color:#ffe6a1;text-shadow:0 0 7px #49bfff}.jack{position:absolute;top:10%;left:28%;width:44%;text-align:center;font-size:clamp(9px,1.4vw,19px);color:#fff2ae;background:#5c0a26cc;border:2px solid #ddaa50;border-radius:40px;padding:3px}.bottom{position:absolute;bottom:1%;left:1%;right:1%;height:17%;display:flex;align-items:center;justify-content:space-between;gap:1%;background:#07132ba8;border:2px solid #ba8b43;border-radius:16px;padding:0 1.5%}.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(8px,1.1vw,15px);white-space:nowrap}.stat b{font-size:clamp(13px,2.2vw,27px);color:white}.btn{border:3px ridge #ffd681;background:radial-gradient(circle at 35% 25%,#2e9ee8,#073b90 65%,#071a3c);color:#ffeb9b;border-radius:50%;height:70%;aspect-ratio:1;cursor:pointer;font-weight:bold;font-size:clamp(10px,1.5vw,20px);box-shadow:0 0 15px #009dff,inset 0 0 12px #5bceff;touch-action:manipulation}.btn:active{transform:scale(.95)}#spin{height:95%;background:radial-gradient(circle at 40% 30%,#ffe39c,#d58a15 55%,#673400);color:#271200;border:4px ridge #fff2a9;font-size:clamp(12px,2.1vw,28px)}#msg{position:absolute;top:79%;left:20%;width:60%;text-align:center;color:#f8e3a6;font-size:clamp(9px,1.1vw,17px)}#orient{display:none}@media(orientation:portrait){#orient{display:flex;position:fixed;inset:0;z-index:99;background:#07152f;align-items:center;justify-content:center;text-align:center;padding:30px;color:#ffdf83;font-size:23px}#stage{display:none}}</style></head><body><div id="app"><div id="stage"><svg id="sky" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="col" x2="0" y2="1"><stop stop-color="#fce4a0"/><stop offset="1" stop-color="#8b5a27"/></linearGradient></defs><path d="M0 350Q150 100 320 280T650 220T1200 280V675H0Z" fill="#96c9f9" opacity=".35"/><path d="M0 510Q160 320 300 440T620 390T1000 430T1200 350V675H0Z" fill="#fff" opacity=".22"/><g fill="#e7e7db" stroke="#d6a957" stroke-width="5"><path d="M410 185h380v16H410zM445 155h310v25H445zM480 125h240l45 30H435z"/><path d="M470 205h28v110h-28zM525 205h28v110h-28zM580 205h28v110h-28zM635 205h28v110h-28zM690 205h28v110h-28zM745 205h28v110h-28z"/><path d="M420 315h360v15H420z"/></g><path d="M790 50l-75 145 45-15-40 135 115-185-55 18z" fill="#b5f8ff" stroke="#18a8ff" stroke-width="8" opacity=".8"/></svg><h1>雷霆神域<span class="sub">THUNDER REALM</span></h1><div class="jack">神域奖池 · <span id="jack">888,888</span></div><div class="side left"><svg class="god" viewBox="0 0 180 250"><path d="M25 220L50 95 75 70 60 40Q55 0 95 15Q135 0 130 45L115 75 145 100 165 220Z" fill="#174b9e"/><circle cx="94" cy="48" r="33" fill="#f4c18a"/><path d="M60 52Q90 95 127 53L125 115Q95 145 65 115Z" fill="#f2f2ef"/><path d="M55 20Q90-20 135 20M48 90L15 170M138 90L172 155" fill="none"/><path d="M140 110l-27 70 25-10-20 65 55-90-27 10z" fill="#b8f7ff"/></svg><label>雷霆之神</label></div><div class="side right"><svg class="god" viewBox="0 0 180 250"><path d="M18 220Q38 95 70 80L65 30Q100-10 130 30L120 80Q160 110 170 220Z" fill="#fff9e9"/><path d="M50 35Q100-15 143 38L140 100 125 70 120 20 80 30 60 95Z" fill="#b77c36"/><circle cx="95" cy="55" r="30" fill="#f8cc9c"/><path d="M65 30L92 8 125 30 95 20z" fill="#fbdc7a"/><path d="M60 130Q100 90 140 130" fill="none"/></svg><label>神谕女神</label></div><div class="panel" id="reels"></div><div id="msg">集齐神域图腾，召唤雷霆之力</div><div class="bottom"><div class="stat">积分<b id="balance">10000</b></div><button class="btn" id="minus">−</button><div class="stat">每次投注<b id="bet">100</b></div><button class="btn" id="plus">＋</button><div class="stat">上次赢得<b id="win">0</b></div><button class="btn" id="auto">自动</button><button class="btn" id="spin">旋转</button><button class="btn" id="info">说明</button></div></div><div id="orient">请将手机横向旋转<br>开启雷霆神域</div></div><script>const names=['闪电','雄鹰','天马','皇冠','头盔','竖琴','宝石','桂冠','圣环'];const shapes=['<path d="M55 3L20 56H47L32 97 84 36H55L70 3Z"/>','<path d="M50 30Q25 0 2 22L30 42 7 58 46 58 50 87 55 58 94 58 70 42 98 22Q75 0 50 30Z"/>','<path d="M20 85Q5 50 30 32L48 10 70 20 83 55 62 45 65 90 45 65Z"/>','<path d="M12 32L28 54 50 14 72 54 88 32 82 83H18Z"/>','<path d="M20 70V38Q50-10 80 38V70L65 85 50 65 35 85Z"/>','<path d="M20 14Q50 34 80 14V78Q50 95 20 78Z M30 14V75M50 23V85M70 14V75"/>','<path d="M50 5L85 35 70 80 30 80 15 35Z M15 35H85M50 5L30 80M50 5L70 80"/>','<path d="M50 86Q0 68 22 22M50 86Q100 68 78 22M25 45L8 30M28 62L9 55M75 45L92 30M72 62L91 55"/>','<circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="17"/><path d="M35 20L45 4H55L65 20"/>'];const colors=['#7be8ff','#eec86b','#f6f5ff','#ef4e6b','#f4aa49','#ffdf7b','#4df1ff','#a9e67e','#ffc858'];let balance=Number(localStorage.getItem('tr_balance')||10000),bet=100,auto=false,spinning=false,grid=Array.from({length:15},()=>Math.floor(Math.random()*9));const $=id=>document.getElementById(id),reels=$('reels');function symbol(i){return '<svg viewBox="0 0 100 100" role="img" aria-label="'+names[i]+'"><defs><linearGradient id="g'+i+'" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="'+colors[i]+'"/><stop offset="1" stop-color="#bd771e"/></linearGradient></defs><g fill="url(#g'+i+')" stroke="#e9b74e" stroke-width="3" stroke-linejoin="round">'+shapes[i]+'</g></svg>'}function draw(wins=[]){reels.innerHTML=grid.map((v,i)=>'<div class="cell '+(wins.includes(i)?'win':'')+'">'+symbol(v)+'</div>').join('')}function sync(){$('balance').textContent=balance.toLocaleString();$('bet').textContent=bet;$('jack').textContent=(888888+Math.floor((10000-balance)/10)).toLocaleString()}function payout(){let total=0,winning=[];for(let r=0;r<3;r++){let start=r*5;for(let c=0;c<3;c++){let v=grid[start+c];let len=1;while(c+len<5&&grid[start+c+len]===v)len++;if(len>=3){total+=bet*({3:2,4:6,5:20}[len])*(v===0?3:1);for(let k=0;k<len;k++)winning.push(start+c+k)}c+=len-1}}return {total,winning}}async function spin(){if(spinning)return;if(balance<bet){$('msg').textContent='积分不足，点击说明重置试玩积分';auto=false;return}spinning=true;balance-=bet;sync();$('win').textContent='0';$('msg').textContent='雷霆之力正在汇聚…';reels.classList.add('spinning');let ticks=0;let timer=setInterval(()=>{grid=grid.map(()=>Math.floor(Math.random()*9));draw();if(++ticks>=12){clearInterval(timer);reels.classList.remove('spinning');grid=grid.map(()=>Math.floor(Math.random()*9));let p=payout();balance+=p.total;draw(p.winning);$('win').textContent=p.total.toLocaleString();$('msg').textContent=p.total?'雷霆降临！赢得 '+p.total+' 积分':'神域静候下一次闪电';sync();localStorage.setItem('tr_balance',balance);spinning=false;if(auto)setTimeout(spin,600)}},90)}$('spin').onclick=spin;$('plus').onclick=()=>{if(!spinning){bet=Math.min(1000,bet+50);sync()}};$('minus').onclick=()=>{if(!spinning){bet=Math.max(50,bet-50);sync()}};$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'停止':'自动';if(auto)spin()};$('info').onclick=()=>{if(confirm('规则：每列3行，共5列。横向连续3个以上相同图腾可获积分。仅供娱乐，不涉及真实金钱。\n是否重置试玩积分？')){balance=10000;localStorage.setItem('tr_balance',balance);sync()}};draw();sync();</script></body></html>
